name: Deploy Widgetbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site is a release artifact, so it is only republished when the package
  # version moves. Run the workflow manually to redeploy without a bump.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: compare
        name: Compare the package version against the previous commit
        run: |
          new=$(grep '^version:' pubspec.yaml)
          # Empty on the first commit, or if the file did not exist yet; either
          # way that counts as a change.
          old=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' || true)
          if [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: '$old' -> '$new'"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($new), skipping the deploy."
          fi

  deploy:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Generate widgetbook catalog
        working-directory: widgetbook
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: widgetbook
        run: flutter build web --base-href /rg-design-system-flutter/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: widgetbook/build/web

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
